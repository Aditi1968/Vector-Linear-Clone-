<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; background: #050a14; -webkit-font-smoothing: antialiased; }
    a { color: #5cc5db; text-decoration: none; }
    a:hover { color: #9fdfec; }
  </style>
</helmet>

<div style="display: grid; grid-template-columns: 224px minmax(0, 1fr); width: 1440px; height: 900px; background: #050a14; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 14px 8px; border-right: 1px solid #101a2e; background: #04080f;">
    <div style="display: flex; align-items: center; gap: 9px; padding: 2px 8px;">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#5cc5db" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="3.9" cy="12.1" r="1.15" fill="#5cc5db" stroke="none"></circle>
        <path d="M5.1 10.9 11.9 4.1"></path>
        <path d="M6.9 4.1h5v5"></path>
      </svg>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #e4eaf5;">Northwind</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <sc-for list="{{nav}}" as="i" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-left: 2px solid {{i.mark}}; border-radius: 0 4px 4px 0; background: {{i.bg}};">
          <span style="font-size: 12.5px; font-weight: {{i.weight}}; color: {{i.fg}};">{{i.label}}</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; color: {{i.countFg}};">{{i.count}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; min-width: 0;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; flex-shrink: 0; padding: 0 24px; border-bottom: 1px solid #101a2e;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <h1 style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: #e9eef7;">Inbox</h1>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #626c7d;">3 UNREAD</span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid #22314c; border-radius: 4px;">
        <div style="display: flex; align-items: center; height: 22px; padding: 0 12px; border-radius: 2px; background: #e9eef7; color: #08101d; font-size: 11.5px; font-weight: 600;">Unread</div>
        <div style="display: flex; align-items: center; height: 22px; padding: 0 12px; border-radius: 2px; color: #98a5bb; font-size: 11.5px;">All</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 8px 26px minmax(0, 1fr) 78px; align-items: center; gap: 14px; height: 62px; padding: 0 24px; border-bottom: 1px solid #101a2e; background: {{n.bg}};">

          <div style="width: 6px; height: 6px; border-radius: 999px; background: {{n.dot}};"></div>

          <div style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 4px; background: #16223a; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; color: #c9d4e6;">{{n.who}}</div>

          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 13.5px; color: {{n.fg}};">{{n.what}}</span>
            <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.06em; color: #626c7d;">{{n.subject}}</span>
          </div>

          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.08em; text-align: right; color: #37527a;">{{n.at}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { who: 'PR', what: 'Priya assigned an issue to you', subject: 'ENG-114 · Repository leaks asyncpg.Record to the service layer', at: '14:02', unread: true },
      { who: 'DC', what: 'Dev commented on an issue you follow', subject: 'APP-91 · Board card move loses focus after optimistic update', at: '13:20', unread: true },
      { who: '—', what: 'An issue you follow is due soon', subject: 'ENG-108 · Composite key missing on the releases join', at: '09:00', unread: true },
      { who: 'AV', what: 'Aditi changed the status of an issue you follow', subject: 'ENG-64 · Sweep expired sessions on the lifespan loop', at: 'Yesterday', unread: false },
      { who: 'PR', what: 'Priya marked an issue you follow as blocked', subject: 'ENG-96 · Keyset pagination drops the last page on ties', at: 'Yesterday', unread: false },
      { who: 'DC', what: 'Dev commented on an issue you follow', subject: 'APP-77 · Rail collapse loses the focused nav item', at: 'Sep 06', unread: false },
      { who: 'AV', what: 'Aditi assigned an issue to you', subject: 'ENG-51 · Rate limit the unauthenticated argon2 path', at: 'Sep 04', unread: false },
    ];

    return {
      nav: [
        { label: 'Issues', count: '24', state: 'off' },
        { label: 'My issues', count: '6', state: 'off' },
        { label: 'Inbox', count: '3', state: 'on' },
        { label: 'Triage', count: '2', state: 'off' },
        { label: 'Projects', count: '5', state: 'off' },
        { label: 'Roadmap', count: '', state: 'off' },
      ].map((i) => ({
        label: i.label, count: i.count,
        bg: i.state === 'on' ? '#101d33' : 'transparent',
        mark: i.state === 'on' ? '#5cc5db' : 'transparent',
        fg: i.state === 'on' ? '#e9eef7' : '#98a5bb',
        countFg: i.state === 'on' ? '#5cc5db' : '#626c7d',
        weight: i.state === 'on' ? 600 : 400,
      })),
      items: data.map((n) => ({
        who: n.who, what: n.what, subject: n.subject, at: n.at,
        dot: n.unread ? '#5cc5db' : 'transparent',
        bg: n.unread ? '#080e1b' : 'transparent',
        fg: n.unread ? '#e9eef7' : '#98a5bb',
      })),
    };
  }
}
</script>
</body>
</html>
