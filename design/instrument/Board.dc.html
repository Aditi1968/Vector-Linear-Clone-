<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; background: #050a14; -webkit-font-smoothing: antialiased; }
    a { color: #5cc5db; text-decoration: none; }
    a:hover { color: #9fdfec; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; background: #050a14; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; flex-shrink: 0; padding: 0 24px; border-bottom: 1px solid #101a2e;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <h1 style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.015em; color: #e9eef7;">Board</h1>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #626c7d;">ENGINEERING &#183; CYCLE 24</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid #22314c; border-radius: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; color: #98a5bb;">GROUP: STATUS</div>
      <div style="display: flex; align-items: center; height: 26px; padding: 0 12px; border: 1px solid #24354f; border-top-color: #ffffff; border-radius: 4px; background-image: linear-gradient(180deg, #eef2f9 0%, #b6c3d8 100%); color: #08101d; font-size: 12px; font-weight: 600;">New issue</div>
    </div>
  </div>

  <!-- Columns as instrument channels: a measured header bar per column. -->
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; flex-grow: 1; min-height: 0; background: #101a2e;">
    <sc-for list="{{columns}}" as="c" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 12px; background: #050a14;">

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="{{c.sColor}}" stroke-width="1.5" aria-hidden="true" focusable="false">
                <circle cx="8" cy="8" r="5.4" stroke-dasharray="{{c.sDash}}"></circle>
                <path d="{{c.sMark}}" fill="{{c.sFill}}" stroke="{{c.sStroke}}" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #98a5bb;">{{c.name}}</span>
            </div>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #626c7d;">{{c.count}}</span>
          </div>
          <div style="height: 2px; background: {{c.sColor}}; opacity: 0.45;"></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 11px 12px; border: 1px solid #16223a; border-radius: 5px; background: #0a1120;">
              <span style="font-size: 13px; line-height: 1.38; color: #e4eaf5; text-wrap: pretty;">{{k.title}}</span>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #626c7d;">{{k.key}}</span>
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
                    <rect x="2" y="9.5" width="2.4" height="3.5" rx="0.6" fill="{{k.p1}}"></rect>
                    <rect x="6.3" y="6.5" width="2.4" height="6.5" rx="0.6" fill="{{k.p2}}"></rect>
                    <rect x="10.6" y="3.5" width="2.4" height="9.5" rx="0.6" fill="{{k.p3}}"></rect>
                  </svg>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 3px; background: #16223a; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9px; font-weight: 600; color: #c9d4e6;">{{k.who}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const CAT = {
      backlog:   { color: '#626c7d', dash: '2.1 2.3', mark: '', fill: 'none', stroke: 'none' },
      unstarted: { color: '#a6aeba', dash: 'none', mark: '', fill: 'none', stroke: 'none' },
      started:   { color: '#efc768', dash: 'none', mark: 'M8 5.2 10.8 8 8 10.8 5.2 8Z', fill: '#efc768', stroke: 'none' },
      completed: { color: '#7fd0a5', dash: 'none', mark: 'm5.3 8.1 1.95 1.95 3.5-3.95', fill: 'none', stroke: '#7fd0a5' },
      canceled:  { color: '#8d96a4', dash: 'none', mark: 'M5.6 10.4 10.4 5.6', fill: 'none', stroke: '#8d96a4' },
    };
    const FILLED = { none: 0, low: 1, medium: 2, high: 3, urgent: 3 };
    const PCOLOR = { none: '#626c7d', low: '#8d96a4', medium: '#a6aeba', high: '#efc768', urgent: '#e4645f' };
    const DIM = '#16223a';

    const card = (key, title, prio, who) => {
      const n = FILLED[prio];
      const on = PCOLOR[prio];
      return { key, title, who, p1: n >= 1 ? on : DIM, p2: n >= 2 ? on : DIM, p3: n >= 3 ? on : DIM };
    };

    const raw = [
      { name: 'Backlog', cat: 'backlog', cards: [
        card('APP-77', 'Rail collapse loses the focused nav item', 'low', 'DC'),
        card('ENG-72', 'Slack delivery loop has no dead-letter path', 'medium', 'AV'),
      ] },
      { name: 'Todo', cat: 'unstarted', cards: [
        card('ENG-108', 'Composite key missing on the releases join', 'urgent', 'AV'),
        card('ENG-96', 'Keyset pagination drops the last page on ties', 'high', 'PR'),
        card('APP-88', 'Command palette steals focus from the composer', 'medium', 'DC'),
      ] },
      { name: 'In Progress', cat: 'started', cards: [
        card('ENG-114', 'Repository leaks asyncpg.Record to the service layer', 'high', 'PR'),
        card('APP-91', 'Board card move loses focus after optimistic update', 'medium', 'DC'),
      ] },
      { name: 'In Review', cat: 'started', cards: [
        card('ENG-101', 'Bound argon2 concurrency behind a semaphore', 'high', 'AV'),
      ] },
      { name: 'Done', cat: 'completed', cards: [
        card('ENG-64', 'Sweep expired sessions on the lifespan loop', 'medium', 'AV'),
        card('ENG-51', 'Rate limit the unauthenticated argon2 path', 'urgent', 'AV'),
        card('APP-40', 'Analytics empty state reads as a chart of zeroes', 'low', 'DC'),
      ] },
    ];

    return {
      columns: raw.map((c) => {
        const s = CAT[c.cat];
        return {
          name: c.name,
          count: String(c.cards.length),
          cards: c.cards,
          sColor: s.color, sDash: s.dash, sMark: s.mark, sFill: s.fill, sStroke: s.stroke,
        };
      }),
    };
  }
}
</script>
</body>
</html>
