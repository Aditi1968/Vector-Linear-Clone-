# The web image's only server block, dropped into /etc/nginx/conf.d/.
#
# Two jobs, and the second one is the reason this file exists at all:
# serve the built bundle, and put the API on the SAME ORIGIN as the page.
#
# `frontend/src/lib/config/env.ts` defaults the GraphQL endpoint to the
# relative path `/graphql`, and `vite.config.ts` makes that true in
# development with a dev-server proxy. Nothing served that proxy in a built
# image, so a container without this file would ship an application whose
# every request went to a path nginx answers with index.html -- HTTP 200,
# `content-type: text/html`, and an Apollo parse error in the console.
#
# Same-origin also buys what the Vite proxy comment describes: the backend
# installs no CORS middleware, and the session cookie needs no SameSite=None
# and no credentialed allow-list as long as the page and the API share an
# origin.

server {
    # 8080, not 80. The base image is nginx-unprivileged, whose worker runs
    # as uid 101 and therefore cannot bind a port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets, so a given URL's content
    # never changes and a year is a safe cache. index.html below is the
    # opposite case and is handled separately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The one unhashed file, and the one that names every hashed one. Cached
    # even briefly, a browser keeps loading the previous deployment's asset
    # URLs after a release -- which 404 the moment the old files are gone.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Everything the backend answers, in one regex block rather than six
    # copies of the same five proxy headers.
    #
    #   graphql               the product API
    #   healthz, readyz       so a probe can reach the API through this pod
    #   integrations          the prefix the GitHub App and Slack app are
    #                         registered against
    #   github, slack         the older spellings the same routers answer on;
    #                         see the PROVIDER_PATHS comment in vite.config.ts
    #
    # Listed rather than proxying everything: an allowlist means a backend
    # route added tomorrow is not exposed through the public web pod by
    # accident.
    location ~ ^/(graphql|healthz|readyz|integrations|github|slack)(/|$) {
        # `api` is the service name in BOTH docker-compose.yml and
        # k8s/service.yaml, deliberately, so one image runs unmodified in
        # both. nginx resolves this once at startup and caches it forever;
        # if the API is not resolvable yet the container exits and is
        # restarted, which is the right behaviour in both orchestrators and
        # is why compose declares `depends_on`.
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback, last so every rule above wins. React Router owns
    # /issues, /invite/<token> and the rest: a deep link reloaded in the
    # browser is a path nginx has no file for, and answering 404 would break
    # every bookmark the product hands out.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
