# Every GraphQL document the cycles feature sends.
#
# Source file; `npm run graphql:codegen` compiles it. The page-size rule that
# governs `CycleIssues` below is documented in
# `src/features/issues/api/operations.graphql`: `first` must be a literal,
# because a variable is charged at `ASSUMED_PAGE_SIZE = 100` by the backend's
# complexity rule during validation and the failure is the whole document
# being refused.
#
# Operation names are unique across every `.graphql` file in `src/`, since
# codegen emits one module -- hence `CycleTeams`, which selects the same
# fields as the projects feature's `ProjectTeams` and reads the same cache
# entry (`Query.teams` keyed by `workspaceSlug`), so the second of the two to
# mount answers from cache rather than from the network.

# Everything `Cycle` exposes bar its timestamps.
#
# `teamId` is what makes a cycle id self-sufficient: a screen reached by a
# direct link can recover the team the cycle belongs to, and therefore scope
# a question to it. ../pages/CycleDetailPage.tsx needs it for exactly one
# thing -- the issues it may offer to add -- because `issueSetCycle` refuses a
# cycle that is not the issue's team's.
fragment CycleFields on Cycle {
  id
  teamId
  number
  name
  startsAt
  endsAt
}

# One team's cycles, in `number` order (`app/repositories/cycles.py`).
#
# `teamId` is required by the schema: cycles belong to a team, and there is
# no workspace-wide cycle list to ask for. The screen carries a team picker
# for exactly that reason. Not a connection and not paginated -- `cycles`
# takes no `first`, so the backend's complexity rule charges it once.
query CycleList($workspaceSlug: String!, $teamId: UUID!) {
  cycles(workspaceSlug: $workspaceSlug, teamId: $teamId) {
    ...CycleFields
  }
}

# One cycle by id. Nullable: null is "no such cycle", not a failure.
query CycleDetail($workspaceSlug: String!, $id: UUID!) {
  cycle(workspaceSlug: $workspaceSlug, id: $id) {
    ...CycleFields
  }
}

# The workspace's teams, for the picker that chooses whose cycles to show.
query CycleTeams($workspaceSlug: String!) {
  teams(workspaceSlug: $workspaceSlug) {
    id
    key
    name
  }
}

# The issues in one cycle.
#
# `filter: { cycleId: $cycleId }` -- the server decides membership, so every
# row that arrives is in this cycle and `totalCount` is how many there are.
# `teamId` is not sent alongside it and would be redundant if it were: a cycle
# belongs to one team, so its issues are that team's already.
#
# `cycle { id }` is no longer selected: the filter answers the question it was
# there to answer, and a card that carries its own cycle id was only ever a
# way to check the server's work.
#
# `priority` is not selected: the integer-to-name convention lives in the
# issues feature and is that feature's to own.
#
# Cost: 25 x (4 + 2 + 1) = 175 of 1000.
query CycleIssues($workspaceSlug: String!, $cycleId: UUID!, $after: String) {
  issues(
    workspaceSlug: $workspaceSlug
    filter: { cycleId: $cycleId }
    first: 25
    after: $after
  ) {
    nodes {
      id
      identifier
      title
      completedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# The team's issues that are in no cycle, for the "add an issue" menu.
#
# Two keys, and both are load-bearing. `cycleId: null` is an explicit null and
# it is the filter -- "the ones in no cycle" -- where an omitted key would
# mean "any cycle" and offer the menu issues already scheduled elsewhere.
# `teamId` comes from `Cycle.teamId`, because `issueSetCycle` refuses a cycle
# that is not the issue's team's (`issues_cycle_fk`), so an issue from another
# team is not a candidate at all.
#
# Not paginated: a menu of candidates, not a browser of the backlog. Cost:
# 15 x 3 = 45 of 1000.
query CycleUnscheduledIssues($workspaceSlug: String!, $teamId: UUID!) {
  issues(
    workspaceSlug: $workspaceSlug
    filter: { teamId: $teamId, cycleId: null }
    first: 15
  ) {
    nodes {
      id
      identifier
      title
    }
  }
}

# Create a cycle.
#
# `errors` and the top-level GraphQL error channel are different things and
# both are read: a cycle whose dates overlap another of the team's is an
# `ExclusionViolation` the service turns into a structured validation error
# inside `data`, while an outage is a rejected promise.
mutation CycleCreate($input: CycleCreateInput!) {
  cycleCreate(input: $input) {
    cycle {
      ...CycleFields
    }
    errors {
      field
      code
      message
    }
  }
}

mutation CycleUpdate($input: CycleUpdateInput!) {
  cycleUpdate(input: $input) {
    cycle {
      ...CycleFields
    }
    errors {
      field
      code
      message
    }
  }
}

# The one mutation in this schema that takes loose arguments rather than an
# input object. Written as the schema declares it rather than wrapped to look
# like its neighbours.
mutation CycleDelete($workspaceSlug: String!, $id: UUID!) {
  cycleDelete(workspaceSlug: $workspaceSlug, id: $id) {
    deletedCycleId
    errors {
      field
      code
      message
    }
  }
}

