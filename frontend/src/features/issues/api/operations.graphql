# Every GraphQL document this feature sends.
#
# This file is the source. `npm run graphql:codegen` builds two files from
# it and from `schema.graphql`:
#
#     src/generated/schema.ts       the schema as TypeScript
#     src/generated/operations.ts   the types and TypedDocumentNodes for the
#                                   operations below
#
# Edit here, never there.
#
# Nothing outside `./` imports a document, and no presentational component
# imports one. Components consume the hooks in this directory, which consume
# the generated document nodes through ./documents.ts.
#
# ================================================================
# Why the page size is a literal and `first` is not a variable
# ================================================================
#
# This is the one thing about these documents that is not obvious, is not a
# matter of taste, and fails in a way that does not look like its cause.
#
# `app/graphql/limits.py` refuses a document over `MAX_COMPLEXITY = 1000`
# during *validation* -- before a resolver runs, before the database is
# touched. Complexity for a list field is
#
#     page size x (complexity of the selections below it)
#
# and the page size comes from `_page_size`, which reads it in the order the
# server itself resolves it: the value written in the document, then the
# argument's declared default, then `ASSUMED_PAGE_SIZE = 100`.
#
# A GraphQL *variable* has no value at validation time -- variables arrive
# with the request, the document is validated before them. `_as_page_size`
# receives a `VariableNode`, `int()` on it raises, and the argument falls
# through to `ASSUMED_PAGE_SIZE`. So `first: $first` is charged at 100 no
# matter that we would have sent 25.
#
# If you are here because you are writing another list query: do not reach
# for `$first`. It is the obvious thing to do and it is priced at 100.
#
# A field with no page-size argument at all is charged once, which is what
# makes `teams`, `workspaceMembers`, `cycles`, `labels` and `workflowStates`
# below effectively free despite each returning a list.
#
# ----------------------------------------------------------------
# The one thing a .graphql file cannot do, and what covers it
# ----------------------------------------------------------------
#
# A GraphQL document has no way to interpolate a TypeScript constant, so the
# `25` below is written out where `src/lib/graphql/pagination.ts` also
# declares `DEFAULT_PAGE_SIZE = 25`. That is two places holding one number,
# so it is pinned by a test rather than by a convention: ./documents.test.ts
# reads the literal out of the parsed document, asserts it equals
# `DEFAULT_PAGE_SIZE`, and recomputes the backend's own cost formula over the
# row selection so that a field added here fails a test rather than every
# list request in production.
#
# The constraint on the value itself: `DEFAULT_PAGE_SIZE` must stay within
# 1..100 (`app.services.issues.FIRST_MIN`/`FIRST_MAX`).

# The three-line shape every payload's failure channel has.
#
# A fragment so that adding a field to it reaches every mutation at once --
# and so no mutation can quietly select fewer than the other five.
fragment ValidationFields on ValidationErrorType {
  field
  code
  message
}

# The row selection, as a fragment so that the list query and every mutation
# that returns an issue cannot drift apart.
#
# That they cannot drift is load-bearing twice over. The cache update in
# ./cache.ts prepends a created issue into the cached list; and every other
# mutation relies on Apollo *normalising* its result over the same entity, so
# a mutation selecting fewer fields than the list would leave the list holding
# a partial `Issue:<uuid>` and reading back as null. A shared fragment makes
# that impossible rather than merely unlikely.
#
# `identifier` rather than `id` is what a row shows: ENG-42 is the name the
# issue is known by outside the product. `workflowStateId` and `assigneeId`
# are raw UUIDs -- the schema exposes no `Issue.assignee` object and no
# `Issue.workflowState` -- so a row resolves them through the lookups
# `IssueWorkspaceContext` below builds once for the whole screen.
fragment IssueRowFields on Issue {
  id
  teamId
  identifier
  title
  priority
  workflowStateId
  assigneeId
  estimate
  dueDate
  completedAt
  createdAt
  updatedAt
  labels {
    id
    name
    color
  }
  project {
    id
    name
  }
  cycle {
    id
    number
    name
  }
}

# The detail selection.
#
# A strict superset of `IssueRowFields`, by construction rather than by
# repetition. Only two fields more: the body, and who filed it. Everything
# else a detail view shows is already on the row, which is what lets opening
# an issue from the list paint instantly from the cache.
fragment IssueDetailFields on Issue {
  ...IssueRowFields
  description
  creatorId
}

# One page of issues, newest first.
#
# Cursor pagination, never offset: `after` carries the opaque keyset cursor
# the server built from the last row it returned (`created_at`, `id`), and
# there is no page number or row count anywhere in this feature to compute an
# offset from even if someone wanted to.
#
# Cost: 25 x (20 per node + 2 on pageInfo) = 550 of 1000.
query IssueList($workspaceSlug: String!, $after: String) {
  # 25 is a LITERAL and must stay one -- see the long note at the top.
  issues(workspaceSlug: $workspaceSlug, first: 25, after: $after) {
    nodes {
      ...IssueRowFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# One issue by id.
#
# `issue(id:)` returns `Issue` **nullable**, so a null result is an ordinary
# answer meaning "no such issue" and not an error condition. Cost: 22.
query IssueDetail($workspaceSlug: String!, $id: UUID!) {
  issue(workspaceSlug: $workspaceSlug, id: $id) {
    ...IssueDetailFields
  }
}

# Everything a screen full of issues needs in order to render the UUIDs the
# rows carry: workflow states, people, projects, and the teams to file into.
#
# One document rather than three because these are read together, change on
# the same slow cadence, and are wanted before the first row is drawn. Cost:
# teams 8 + workspaceMembers 3 + projects 50 x 3 = 161.
#
# `teams` also feeds the composer: `issueCreate` requires a `teamId` and the
# server picks no default.
query IssueWorkspaceContext($workspaceSlug: String!) {
  teams(workspaceSlug: $workspaceSlug) {
    id
    key
    name
    # `category` is what the UI branches on. The name belongs to the team and
    # may say anything; the category is the fixed meaning behind it.
    workflowStates {
      id
      name
      category
      color
      position
    }
  }
  workspaceMembers(workspaceSlug: $workspaceSlug) {
    userId
    name
    email
  }
  projects(workspaceSlug: $workspaceSlug, first: 50) {
    nodes {
      id
      name
      state
    }
  }
}

# The cycles an issue can be moved into.
#
# Separate from `IssueWorkspaceContext` because `cycles` requires a `teamId`
# and the team is a property of the issue, which is not known until one is
# open. Cost: 5.
query TeamCycles($workspaceSlug: String!, $teamId: UUID!) {
  cycles(workspaceSlug: $workspaceSlug, teamId: $teamId) {
    id
    number
    name
    startsAt
    endsAt
  }
}

# Create an issue.
#
# Both failure channels are selected, because the server uses both and they
# mean different things:
#
#   - `errors` inside the payload is *expected user input* being rejected.
#     It arrives in `data` with an HTTP 200 and no GraphQL `errors` array.
#   - a top-level GraphQL error is anything else: an outage, a bug, a
#     transport failure. It arrives as a rejected promise from `mutate`.
#
# A client that reads only one of the two either silently discards validation
# feedback or reports a database outage as a bad title. ./outcome.ts reads
# both, for this mutation and for the four below it.
mutation IssueCreate($input: IssueCreateInput!) {
  issueCreate(input: $input) {
    issue {
      ...IssueDetailFields
    }
    errors {
      ...ValidationFields
    }
  }
}

# Edit an issue.
#
# The id is an argument and not part of the input, which is the schema's
# choice and worth noticing at the call site: `IssueUpdateInput` carries the
# workspace and the fields, and every field on it is optional because the
# mutation is a patch -- an omitted field is left alone.
#
# Null is therefore not "omitted": sending `assigneeId: null` unassigns.
# ./useIssueMutations.ts builds the patch so that the difference is explicit.
mutation IssueUpdate($id: UUID!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    issue {
      ...IssueDetailFields
    }
    errors {
      ...ValidationFields
    }
  }
}

# Placement. Two mutations rather than fields on `issueUpdate`, because that
# is how the schema exposes them -- `IssueUpdateInput` has no `projectId` and
# no `cycleId`.
mutation IssueSetProject($input: IssueSetProjectInput!) {
  issueSetProject(input: $input) {
    issue {
      ...IssueDetailFields
    }
    errors {
      ...ValidationFields
    }
  }
}

mutation IssueSetCycle($input: IssueSetCycleInput!) {
  issueSetCycle(input: $input) {
    issue {
      ...IssueDetailFields
    }
    errors {
      ...ValidationFields
    }
  }
}

# Take an issue off the board.
#
# Only `id` is selected from the returned issue: an archived issue is absent
# from every query afterwards, so there is nothing to keep up to date -- what
# the client does with this result is remove the row (./cache.ts).
mutation IssueArchive($workspaceSlug: String!, $id: UUID!) {
  issueArchive(workspaceSlug: $workspaceSlug, id: $id) {
    issue {
      id
    }
    errors {
      ...ValidationFields
    }
  }
}
