# Every GraphQL document the board sends. Two.
#
# Source file; `npm run graphql:codegen` compiles it into
# `src/generated/operations.ts`. Operation names are unique across every
# `.graphql` file under `src/`, because codegen emits one module from all of
# them -- hence the `Board` prefix.
#
# ## Both documents reuse fragments the issues feature declares
#
# `IssueRowFields` and `ValidationFields` are defined in
# `src/features/issues/api/operations.graphql` and are in scope here because
# the generator loads every document as one set. That reuse is not a
# convenience: a board card shows the same facts a list row does, and a
# fragment shared with the list is what guarantees the two cannot select
# different fields of the same cached `Issue:<uuid>` and leave one of them
# reading a partial entity.
#
# The page-size rule that governs `first: 25` below is documented at length in
# that same file: `first` must be a LITERAL, because the backend's complexity
# limiter cannot read a variable at validation time and charges the field at
# `ASSUMED_PAGE_SIZE = 100` instead of at 25.

# One page of a team's issues, filtered and ordered as the board is.
#
# `$filter` carries the team and every filter the controls offer, and
# `$orderBy` carries the sort. Both are whole input objects rather than one
# variable per control, because the filter has a rule a per-argument document
# could not keep: an absent filter must be an ABSENT KEY, since
# `IssueFilterInput` spells "unassigned", "unfiled" and "no cycle" as explicit
# nulls. ../lib/viewState.ts builds the object and is where that is enforced.
#
# The team is inside the filter and is never omitted: columns are the selected
# team's `workflowStates`, and a workspace-wide page would fill them with
# issues whose `workflowStateId` matches no column on screen.
#
# The cache keys this field on `['workspaceSlug', 'filter', 'orderBy']`
# (`src/lib/graphql/cache.ts`), so each filtered board is its own list rather
# than pages of one, and switching a filter cannot interleave two orderings.
#
# Cost: 25 x (20 per node + 2 on pageInfo + 1) = 575 of 1000.
query BoardIssues(
  $workspaceSlug: String!
  $filter: IssueFilterInput!
  $orderBy: IssueOrderInput!
  $after: String
) {
  issues(
    workspaceSlug: $workspaceSlug
    filter: $filter
    orderBy: $orderBy
    first: 25
    after: $after
  ) {
    nodes {
      ...IssueRowFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

# Every label in the workspace, for the label picker.
#
# The pickers used to be built from the loaded cards, on the argument that an
# option that matched nothing on the board was noise. Server-side filtering
# turns that argument inside out: once a filter is applied the loaded cards
# are only the matching ones, so a picker built from them offers the filter
# already selected and nothing else -- a control that cannot be changed
# without being cleared first. The other three pickers read lists the screen
# already loads (members, projects, the team's cycles); this is the one label
# list, and it reads the same cache entry as the issue inspector's own label
# picker. Cost: 50 x 2 = 100 of 1000.
query BoardLabels($workspaceSlug: String!) {
  labels(workspaceSlug: $workspaceSlug, first: 50) {
    nodes {
      id
      name
    }
  }
}

# Move a card to another column.
#
# `issueUpdate` with only `workflowStateId` in the patch -- every field of
# `IssueUpdateInput` is optional and an omitted one is left alone, so this
# says "change the status and nothing else" rather than resubmitting the card.
#
# It selects `IssueRowFields` and not `IssueDetailFields`, which is the one
# thing here worth stating. The rule the issues feature documents is that a
# mutation must not select FEWER fields than the list, or Apollo normalises a
# partial `Issue:<uuid>` over the cached list and the row reads back as null.
# This selects exactly the list's fields, which satisfies that -- and it is
# what makes an honest optimistic response possible at all: the board holds
# rows, so a row is the only shape it can predict. Asking for the detail
# fragment would mean inventing a `description` the board has never seen.
#
# Both failure channels are selected because the server uses both: `errors`
# inside the payload is a rejected patch arriving in `data`, while an outage
# is a rejected promise from `mutate`.
mutation BoardIssueMove($id: UUID!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    issue {
      ...IssueRowFields
    }
    errors {
      ...ValidationFields
    }
  }
}
