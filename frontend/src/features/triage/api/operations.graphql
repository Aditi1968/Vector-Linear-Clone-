# Setting a priority or an assignee from the queue.
#
# `issueUpdate` and not a triage-specific mutation, deliberately: the backend
# exposes no `triageAssign` or `triagePrioritise` because prioritising an
# issue is the same act wherever it is done.
#
# A second document over the same field rather than the issues feature's
# `IssueUpdate`, because that one selects `IssueDetailFields` for its
# optimistic response and `useIssueMutations().updateIssue` takes a whole
# `IssueDetailFields` as its first argument -- which a triage row does not
# have and cannot cheaply get, since `TriageIssue.issue` is an
# `IssueSummary`. This selects the two fields the queue can change.
#
# Note the two are different cache types: `IssueSummary:<id>` is not
# `Issue:<id>`, so normalising this result does NOT update the row above it.
# ../api/mutations.ts refetches `TriageQueue`, same as the five verbs.
mutation TriageIssueUpdate($id: UUID!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    issue {
      id
      priority
      assigneeId
    }
    errors {
      field
      code
      message
    }
  }
}
