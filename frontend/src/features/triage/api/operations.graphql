# Every GraphQL document the triage feature sends.
#
# Source file; `npm run graphql:codegen` compiles it. Edit here, never
# `src/generated/`.
#
# The page-size rule that governs `TriageQueue` below is documented at length
# in `src/features/issues/api/operations.graphql`: `first` must be a literal,
# because a variable has no value at validation time and
# `app/graphql/limits.py` charges it at `ASSUMED_PAGE_SIZE = 100`. Writing
# `first: $first` here would price this document at 100 rows no matter that
# we send 25.
#
# Operation names are unique across every `.graphql` file under `src/`, since
# codegen emits one module.

# One row of the queue.
#
# `TriageIssue.issue` is `IssueSummary!`, NOT `Issue`. `IssueSummary` has
# since been widened and now DOES carry `workflowStateId`, `assigneeId`,
# `dueDate`, `teamId`, `estimate` and the rest -- so the old note here, that
# the type had none of them, is no longer true and the selection set below is
# now the only thing that decides what a row can draw.
#
# It selects five fields, and ../components/TriageRow.tsx draws exactly
# those: a priority glyph, a key, a title and an age. No status glyph and no
# avatar, because this document does not ask for a state or an assignee. That
# is the honest rendering -- a cell reading "Unassigned" because the field was
# never fetched is indistinguishable from a genuinely empty one, and it would
# be a lie the row could not detect.
#
# Widening the selection to draw those columns is a real option and costs
# little (25 x 8 = 200 of 1000, against 175 today). It is a query change plus
# codegen plus two more lookups per row, and it belongs in a pass that is
# changing what the screen says -- not in one changing how it looks.
#
# `description` is selected and nothing renders it -- the duplicate picker
# shows `identifier · title`. It was selected for that picker and the picker
# never used it. Left in rather than trimmed here, because dropping a field
# means regenerating `src/generated/operations.ts`, which is not a thing a
# restyle should be doing to a file every feature imports.
fragment TriageRowFields on TriageIssue {
  issue {
    id
    identifier
    title
    description
    priority
  }
  # When the issue entered the queue. The queue is ordered by it, oldest
  # first, so this doubles as the row's position.
  enteredAt
}

# One team's triage queue, plus how long it is.
#
# `teamId` is required by the schema -- a triage queue belongs to a team, so
# there is no workspace-wide queue to ask for, which is why the screen leads
# with a team picker exactly as the cycles screen does.
#
# `triageCount` rides in the same document rather than in a second query: it
# is a single integer scoped to the same two arguments, so asking separately
# would be a second round trip for one number that must agree with the list
# beside it.
#
# `TriageIssueConnection` has `nodes` and `pageInfo` and NO `totalCount` --
# `triageCount` is how the total is known, and the two are deliberately not
# the same number: the count is the whole queue, the list is what has been
# paged in.
#
# Cost: 25 x (nodes 5 + pageInfo 2) = 175, plus 1 for the count, of 1000.
query TriageQueue($workspaceSlug: String!, $teamId: UUID!, $after: String) {
  triageIssues(
    workspaceSlug: $workspaceSlug
    teamId: $teamId
    first: 25
    after: $after
  ) {
    nodes {
      ...TriageRowFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  triageCount(workspaceSlug: $workspaceSlug, teamId: $teamId)
}

# The five triage verbs.
#
# Every one returns `TriagePayload { issue, errors }`, and every one of them
# changes which rows are in the queue -- accepting, declining and marking a
# duplicate all remove a row, and changing team moves it to another team's
# queue entirely. Normalising the returned `Issue` cannot fix that, because
# membership of a server-filtered connection is not a property of any entity
# in it, so ../api/mutations.ts refetches `TriageQueue` after each.
#
# `issue { id }` is selected rather than nothing: it is the cheapest proof
# that the write landed on the row we named, and `readPayload` treats a
# payload with neither an issue nor an error as a failed save.

# Put an issue INTO the queue. Not reachable from this screen -- everything
# already here is in triage -- and kept because the queue's own emptiness is
# the one place the product can explain what triage is for. See ../api/index.ts.
mutation TriageEnter($input: TriageEnterInput!) {
  triageEnter(input: $input) {
    issue {
      id
    }
    errors {
      field
      code
      message
    }
  }
}

# Accept an issue into a workflow state. The state is required by the schema
# and is not defaulted here: "accepted" is not a state, it is whichever state
# of that team's board the person chose.
mutation TriageAccept($input: TriageAcceptInput!) {
  triageAccept(input: $input) {
    issue {
      id
    }
    errors {
      field
      code
      message
    }
  }
}

mutation TriageDecline($input: TriageDeclineInput!) {
  triageDecline(input: $input) {
