"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

type Issue {
  id: UUID!
  title: String!
  description: String
  priority: Int!
  projectId: UUID
  milestoneId: UUID
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  project: Project
}

type IssueConnection {
  nodes: [Issue!]!
  pageInfo: PageInfo!
}

input IssueCreateInput {
  title: String!
  description: String = null
  priority: Int! = 0
}

type IssueCreatePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input IssueSetProjectInput {
  issueId: UUID!
  projectId: UUID = null
  milestoneId: UUID = null
}

type IssueSetProjectPayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input LoginInput {
  email: String!
  password: String!
}

type LoginPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type LogoutPayload {
  signedOut: Boolean!
  errors: [ValidationErrorType!]!
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssueCreatePayload!
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  logout: LogoutPayload!
  projectCreate(input: ProjectCreateInput!): ProjectPayload!
  projectUpdate(input: ProjectUpdateInput!): ProjectPayload!
  projectDelete(input: ProjectDeleteInput!): ProjectDeletePayload!
  projectTeamAdd(input: ProjectTeamInput!): ProjectPayload!
  projectTeamRemove(input: ProjectTeamInput!): ProjectPayload!
  projectMilestoneCreate(input: ProjectMilestoneCreateInput!): ProjectMilestonePayload!
  projectMilestoneUpdate(input: ProjectMilestoneUpdateInput!): ProjectMilestonePayload!
  projectMilestoneDelete(input: ProjectMilestoneDeleteInput!): ProjectMilestoneDeletePayload!
  issueSetProject(input: IssueSetProjectInput!): IssueSetProjectPayload!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Project {
  id: UUID!
  name: String!
  description: String
  state: ProjectState!
  targetDate: Date
  leadId: UUID
  teamIds: [UUID!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  milestones: [ProjectMilestone!]!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: PageInfo!
}

input ProjectCreateInput {
  name: String!
  description: String = null
  state: ProjectState! = PLANNED
  targetDate: Date = null
  leadId: UUID = null
}

input ProjectDeleteInput {
  id: UUID!
}

type ProjectDeletePayload {
  deletedProjectId: UUID
  errors: [ValidationErrorType!]!
}

type ProjectMilestone {
  id: UUID!
  projectId: UUID!
  name: String!
  targetDate: Date
  position: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input ProjectMilestoneCreateInput {
  projectId: UUID!
  name: String!
  targetDate: Date = null
}

input ProjectMilestoneDeleteInput {
  id: UUID!
}

type ProjectMilestoneDeletePayload {
  deletedMilestoneId: UUID
  errors: [ValidationErrorType!]!
}

type ProjectMilestonePayload {
  milestone: ProjectMilestone
  errors: [ValidationErrorType!]!
}

input ProjectMilestoneUpdateInput {
  id: UUID!
  name: String
  targetDate: Date
  position: Int
}

type ProjectPayload {
  project: Project
  errors: [ValidationErrorType!]!
}

enum ProjectState {
  PLANNED
  STARTED
  PAUSED
  COMPLETED
  CANCELED
}

input ProjectTeamInput {
  projectId: UUID!
  teamId: UUID!
}

input ProjectUpdateInput {
  id: UUID!
  name: String
  description: String
  state: ProjectState
  targetDate: Date
  leadId: UUID
}

type Query {
  issue(id: UUID!): Issue
  issues(first: Int! = 50, after: String = null): IssueConnection!
  me: User

  """
  The teams in a workspace, each with the workflow states its issues can occupy.
  """
  teams(workspaceSlug: String!): [Team!]!
  myWorkspaces: [WorkspaceMembership!]!
  myWorkspace(slug: String!): WorkspaceMembership!
  project(id: UUID!): Project
  projects(first: Int! = 50, after: String = null): ProjectConnection!
}

input RegisterInput {
  email: String!
  password: String!
  name: String = null
}

type RegisterPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type Team {
  id: UUID!

  """
  The prefix of this team's issue identifiers -- the ENG in ENG-42. Unique within the workspace, and not beyond it.
  """
  key: String!
  name: String!
  createdAt: DateTime!
  workflowStates: [WorkflowState!]!
}

scalar UUID

type User {
  id: UUID!
  email: String!
  name: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ValidationErrorType {
  field: String!
  code: String!
  message: String!
}

"""A status an issue can occupy on one team's board."""
type WorkflowState {
  id: UUID!
  name: String!

  """
  The fixed category this state belongs to. Branch on this, never on the name, which the team owns and may change.
  """
  category: WorkflowStateCategory!
  position: Int!
  color: String
}

"""What a workflow state means, independent of what it is called."""
enum WorkflowStateCategory {
  BACKLOG
  UNSTARTED
  STARTED
  COMPLETED
  CANCELED
}

type Workspace {
  id: UUID!
  slug: String!
  name: String!
}

type WorkspaceMembership {
  workspace: Workspace!
  role: WorkspaceRole!
  createdAt: DateTime!
}

enum WorkspaceRole {
  MEMBER
  ADMIN
  OWNER
}
