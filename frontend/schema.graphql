type Query {
  issue(id: UUID!): Issue
  issues(first: Int! = 50, after: String = null): IssueConnection!
  me: User

  """
  The teams in a workspace, each with the workflow states its issues can occupy.
  """
  teams(workspaceSlug: String!): [Team!]!
  myWorkspaces: [WorkspaceMembership!]!
  myWorkspace(slug: String!): WorkspaceMembership!

  """Everyone in a workspace, with the role each holds. Members only."""
  workspaceMembers(workspaceSlug: String!): [WorkspaceMember!]!

  """
  Invitations to this workspace that have not been accepted or expired. Admins and owners only.
  """
  invitations(workspaceSlug: String!): [WorkspaceInvitation!]!
  label(id: UUID!): Label
  labels(first: Int! = 50, after: String = null): LabelConnection!
  cycle(id: UUID!): Cycle
  cycles(teamId: UUID!): [Cycle!]!
  project(id: UUID!): Project
  projects(first: Int! = 50, after: String = null): ProjectConnection!
  search(workspaceSlug: String!, query: String!, first: Int! = 20): SearchResults!
}

