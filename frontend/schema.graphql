"""Date with time (isoformat)"""
scalar DateTime

type Issue {
  id: UUID!
  title: String!
  description: String
  priority: Int!
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type IssueConnection {
  nodes: [Issue!]!
  pageInfo: PageInfo!
}

input IssueCreateInput {
  title: String!
  description: String = null
  priority: Int! = 0
}

type IssueCreatePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input LoginInput {
  email: String!
  password: String!
}

type LoginPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type LogoutPayload {
  signedOut: Boolean!
  errors: [ValidationErrorType!]!
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssueCreatePayload!
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  logout: LogoutPayload!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  issue(id: UUID!): Issue
  issues(first: Int! = 50, after: String = null): IssueConnection!
  me: User
}

input RegisterInput {
  email: String!
  password: String!
  name: String = null
}

type RegisterPayload {
  user: User
  errors: [ValidationErrorType!]!
}

scalar UUID

type User {
  id: UUID!
  email: String!
  name: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ValidationErrorType {
  field: String!
  code: String!
  message: String!
}
