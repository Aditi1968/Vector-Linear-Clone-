  errors: [ValidationErrorType!]!
}

type SearchResults {
  issues: [Issue!]!
  projects: [Project!]!
}

type Team {
  id: UUID!

  """
  The prefix of this team's issue identifiers -- the ENG in ENG-42. Unique within the workspace, and not beyond it.
  """
  key: String!
  name: String!
  createdAt: DateTime!
  workflowStates: [WorkflowState!]!
}

input TeamCreateInput {
  workspaceSlug: String!
  name: String!

  """
  The prefix of this team's issue identifiers -- the ENG in ENG-42. 1-10 uppercase letters and digits, starting with a letter. Unique within the workspace.
  """
  key: String!
}

type TeamPayload {
  team: Team
  errors: [ValidationErrorType!]!
}

scalar UUID

type User {
  id: UUID!
  email: String!
  name: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ValidationErrorType {
  field: String!
  code: String!
  message: String!
}

"""A status an issue can occupy on one team's board."""
type WorkflowState {
  id: UUID!
  name: String!

  """
  The fixed category this state belongs to. Branch on this, never on the name, which the team owns and may change.
  """
  category: WorkflowStateCategory!
  position: Int!
  color: String
}

"""What a workflow state means, independent of what it is called."""
enum WorkflowStateCategory {
  BACKLOG
  UNSTARTED
  STARTED
  COMPLETED
  CANCELED
}

type Workspace {
  id: UUID!
  slug: String!
  name: String!
}

input WorkspaceCreateInput {
  name: String!

  """
  The workspace's URL segment. Lowercase letters, digits and hyphens; must start and end with a letter or digit.
  """
  slug: String!
}

"""An outstanding invitation to join a workspace."""
type WorkspaceInvitation {
  id: UUID!
  email: String!
  role: WorkspaceRole!
  expiresAt: DateTime!
  createdAt: DateTime!
}

"""One person in a workspace, and the role they hold there."""
type WorkspaceMember {
  userId: UUID!
  email: String!
  name: String
  role: WorkspaceRole!
  createdAt: DateTime!
}

type WorkspaceMemberPayload {
  member: WorkspaceMember
  errors: [ValidationErrorType!]!
}

type WorkspaceMembership {
  workspace: Workspace!
  role: WorkspaceRole!
  createdAt: DateTime!
}

type WorkspacePayload {
  workspace: Workspace
  errors: [ValidationErrorType!]!
}

enum WorkspaceRole {
  MEMBER
  ADMIN
  OWNER
}
