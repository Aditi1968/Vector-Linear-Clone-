type Comment {
  id: UUID!
  issueId: UUID!
  authorId: UUID!
  body: String!
  editedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type CommentConnection {
  nodes: [Comment!]!
  pageInfo: PageInfo!
}

input CommentCreateInput {
  issueId: UUID!
  body: String!
}

type CommentCreatePayload {
  comment: Comment
  errors: [ValidationErrorType!]!
}

input CommentDeleteInput {
  id: UUID!
}

type CommentDeletePayload {
  deletedCommentId: UUID
  errors: [ValidationErrorType!]!
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

type Issue {
  id: UUID!
  teamId: UUID!

  """
  The name this issue is known by outside the product -- ENG-42. Its team's key, a hyphen, and the issue's number.
  """
  identifier: String!

  """
  Sequential within the team and never reused. Unique only alongside the team; two teams both have a number 42.
  """
  number: Int!
  title: String!
  description: String
  priority: Int!
  workflowStateId: UUID!
  assigneeId: UUID

  """
  Who filed the issue, or null where that is not known -- an issue created before accounts existed, or one whose author's account has since been deleted.
  """
  creatorId: UUID
  estimate: Int

  """
  A calendar day, not an instant: the same day for every viewer, in every timezone.
  """
  dueDate: Date

  """
  When the issue stopped being worked on. Derived from the workflow state's category and not settable directly: it is non-null exactly while the issue sits in a completed or canceled state.
  """
  completedAt: DateTime

  """
  When the issue was taken off the board. Always null here, because archived issues are absent from every query -- only the archive mutation's own result carries a value.
  """
  archivedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  labels: [Label!]!
  comments(first: Int! = 20, after: String = null): CommentConnection!
}

type IssueArchivePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

type IssueConnection {
  nodes: [Issue!]!
  pageInfo: PageInfo!
}

input IssueCreateInput {
  title: String!
  description: String = null
  priority: Int! = 0
  assigneeId: UUID = null
  estimate: Int = null
  dueDate: Date = null
}

type IssueCreatePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input IssueLabelInput {
  issueId: UUID!
  labelId: UUID!
}

type IssueLabelPayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input IssueUpdateInput {
  title: String
  description: String
  priority: Int
  workflowStateId: UUID
  assigneeId: UUID
  estimate: Int
  dueDate: Date
}

type IssueUpdatePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

type Label {
  id: UUID!
  name: String!
  color: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type LabelConnection {
  nodes: [Label!]!
  pageInfo: PageInfo!
}

input LabelCreateInput {
  name: String!
  color: String = null
}

input LabelDeleteInput {
  id: UUID!
}

type LabelDeletePayload {
  deletedLabelId: UUID
  errors: [ValidationErrorType!]!
}

type LabelPayload {
  label: Label
  errors: [ValidationErrorType!]!
}

input LabelUpdateInput {
  id: UUID!
  name: String!
  color: String!
}

input LoginInput {
  email: String!
  password: String!
}

type LoginPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type LogoutPayload {
  signedOut: Boolean!
  errors: [ValidationErrorType!]!
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssueCreatePayload!
  issueUpdate(id: UUID!, input: IssueUpdateInput!): IssueUpdatePayload!
  issueArchive(id: UUID!): IssueArchivePayload!
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  logout: LogoutPayload!
  labelCreate(input: LabelCreateInput!): LabelPayload!
  labelUpdate(input: LabelUpdateInput!): LabelPayload!
  labelDelete(input: LabelDeleteInput!): LabelDeletePayload!
  issueLabelAttach(input: IssueLabelInput!): IssueLabelPayload!
  issueLabelDetach(input: IssueLabelInput!): IssueLabelPayload!
  commentCreate(input: CommentCreateInput!): CommentCreatePayload!
  commentDelete(input: CommentDeleteInput!): CommentDeletePayload!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  issue(id: UUID!): Issue
  issues(first: Int! = 50, after: String = null): IssueConnection!
  me: User

  """
  The teams in a workspace, each with the workflow states its issues can occupy.
  """
  teams(workspaceSlug: String!): [Team!]!
  myWorkspaces: [WorkspaceMembership!]!
  myWorkspace(slug: String!): WorkspaceMembership!
  label(id: UUID!): Label
  labels(first: Int! = 50, after: String = null): LabelConnection!
}

input RegisterInput {
  email: String!
  password: String!
  name: String = null
}

type RegisterPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type Team {
  id: UUID!

  """
  The prefix of this team's issue identifiers -- the ENG in ENG-42. Unique within the workspace, and not beyond it.
  """
  key: String!
  name: String!
  createdAt: DateTime!
  workflowStates: [WorkflowState!]!
}

scalar UUID

type User {
  id: UUID!
  email: String!
  name: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ValidationErrorType {
  field: String!
  code: String!
  message: String!
}

"""A status an issue can occupy on one team's board."""
type WorkflowState {
  id: UUID!
  name: String!

  """
  The fixed category this state belongs to. Branch on this, never on the name, which the team owns and may change.
  """
  category: WorkflowStateCategory!
  position: Int!
  color: String
}

"""What a workflow state means, independent of what it is called."""
enum WorkflowStateCategory {
  BACKLOG
  UNSTARTED
  STARTED
  COMPLETED
  CANCELED
}

type Workspace {
  id: UUID!
  slug: String!
  name: String!
}

type WorkspaceMembership {
  workspace: Workspace!
  role: WorkspaceRole!
  createdAt: DateTime!
}

enum WorkspaceRole {
  MEMBER
  ADMIN
  OWNER
}
