type Mutation {
  issueCreate(input: IssueCreateInput!): IssueCreatePayload!
  issueUpdate(id: UUID!, input: IssueUpdateInput!): IssueUpdatePayload!
  issueArchive(id: UUID!): IssueArchivePayload!
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  logout: LogoutPayload!

  """Create a workspace. The authenticated caller becomes its owner."""
  workspaceCreate(input: WorkspaceCreateInput!): WorkspacePayload!

  """
  Create a team, seeded with the default workflow states. Requires the admin or owner role.
  """
  teamCreate(input: TeamCreateInput!): TeamPayload!

  """Change a member's role. Requires the admin or owner role."""
  memberRoleUpdate(input: MemberRoleUpdateInput!): WorkspaceMemberPayload!

  """
  Remove someone from the workspace. Requires the admin or owner role, and cannot remove the last owner.
  """
  memberRemove(input: MemberRemoveInput!): MemberRemovePayload!

  """
  Invite an email address to the workspace. Returns the raw invitation token once and never again.
  """
  invitationCreate(input: InvitationCreateInput!): InvitationCreatePayload!

  """Withdraw an invitation. Requires the admin or owner role."""
  invitationRevoke(input: InvitationRevokeInput!): InvitationRevokePayload!

  """Redeem an invitation token as the authenticated caller."""
  invitationAccept(input: InvitationAcceptInput!): InvitationAcceptPayload!
  labelCreate(input: LabelCreateInput!): LabelPayload!
  labelUpdate(input: LabelUpdateInput!): LabelPayload!
  labelDelete(input: LabelDeleteInput!): LabelDeletePayload!
  issueLabelAttach(input: IssueLabelInput!): IssueLabelPayload!
  issueLabelDetach(input: IssueLabelInput!): IssueLabelPayload!
  commentCreate(input: CommentCreateInput!): CommentCreatePayload!
  commentDelete(input: CommentDeleteInput!): CommentDeletePayload!
  cycleCreate(input: CycleCreateInput!): CyclePayload!
  cycleUpdate(input: CycleUpdateInput!): CyclePayload!
  cycleDelete(id: UUID!): CycleDeletePayload!
  issueSetCycle(input: IssueSetCycleInput!): IssueSetCyclePayload!
  projectCreate(input: ProjectCreateInput!): ProjectPayload!
  projectUpdate(input: ProjectUpdateInput!): ProjectPayload!
  projectDelete(input: ProjectDeleteInput!): ProjectDeletePayload!
  projectTeamAdd(input: ProjectTeamInput!): ProjectPayload!
  projectTeamRemove(input: ProjectTeamInput!): ProjectPayload!
  projectMilestoneCreate(input: ProjectMilestoneCreateInput!): ProjectMilestonePayload!
  projectMilestoneUpdate(input: ProjectMilestoneUpdateInput!): ProjectMilestonePayload!
  projectMilestoneDelete(input: ProjectMilestoneDeleteInput!): ProjectMilestoneDeletePayload!
  issueSetProject(input: IssueSetProjectInput!): IssueSetProjectPayload!
  issueSetParent(input: IssueSetParentInput!): IssueParentPayload!
  issueClearParent(input: IssueClearParentInput!): IssueParentPayload!
  issueRelationCreate(input: IssueRelationCreateInput!): IssueRelationCreatePayload!
  issueRelationDelete(input: IssueRelationDeleteInput!): IssueRelationDeletePayload!
}

