type Cycle {
  id: UUID!
  number: Int!
  name: String
  startsAt: DateTime!
  endsAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CycleCreateInput {
  teamId: UUID!
  number: Int!
  startsAt: DateTime!
  endsAt: DateTime!
  name: String = null
}

type CycleDeletePayload {
  deletedCycleId: UUID
  errors: [ValidationErrorType!]!
}

type CyclePayload {
  cycle: Cycle
  errors: [ValidationErrorType!]!
}

input CycleUpdateInput {
  id: UUID!
  number: Int!
  startsAt: DateTime!
  endsAt: DateTime!
  name: String = null
}

"""Date with time (isoformat)"""
scalar DateTime

type Issue {
  id: UUID!
  title: String!
  description: String
  priority: Int!
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  cycle: Cycle
}

type IssueConnection {
  nodes: [Issue!]!
  pageInfo: PageInfo!
}

input IssueCreateInput {
  title: String!
  description: String = null
  priority: Int! = 0
}

type IssueCreatePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input IssueSetCycleInput {
  issueId: UUID!
  cycleId: UUID = null
}

type IssueSetCyclePayload {
  issue: Issue
  errors: [ValidationErrorType!]!
}

input LoginInput {
  email: String!
  password: String!
}

type LoginPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type LogoutPayload {
  signedOut: Boolean!
  errors: [ValidationErrorType!]!
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssueCreatePayload!
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  logout: LogoutPayload!
  cycleCreate(input: CycleCreateInput!): CyclePayload!
  cycleUpdate(input: CycleUpdateInput!): CyclePayload!
  cycleDelete(id: UUID!): CycleDeletePayload!
  issueSetCycle(input: IssueSetCycleInput!): IssueSetCyclePayload!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  issue(id: UUID!): Issue
  issues(first: Int! = 50, after: String = null): IssueConnection!
  me: User

  """
  The teams in a workspace, each with the workflow states its issues can occupy.
  """
  teams(workspaceSlug: String!): [Team!]!
  myWorkspaces: [WorkspaceMembership!]!
  myWorkspace(slug: String!): WorkspaceMembership!
  cycle(id: UUID!): Cycle
  cycles(teamId: UUID!): [Cycle!]!
}

input RegisterInput {
  email: String!
  password: String!
  name: String = null
}

type RegisterPayload {
  user: User
  errors: [ValidationErrorType!]!
}

type Team {
  id: UUID!

  """
  The prefix of this team's issue identifiers -- the ENG in ENG-42. Unique within the workspace, and not beyond it.
  """
  key: String!
  name: String!
  createdAt: DateTime!
  workflowStates: [WorkflowState!]!
}

scalar UUID

type User {
  id: UUID!
  email: String!
  name: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ValidationErrorType {
  field: String!
  code: String!
  message: String!
}

"""A status an issue can occupy on one team's board."""
type WorkflowState {
  id: UUID!
  name: String!

  """
  The fixed category this state belongs to. Branch on this, never on the name, which the team owns and may change.
  """
  category: WorkflowStateCategory!
  position: Int!
  color: String
}

"""What a workflow state means, independent of what it is called."""
enum WorkflowStateCategory {
  BACKLOG
  UNSTARTED
  STARTED
  COMPLETED
  CANCELED
}

type Workspace {
  id: UUID!
  slug: String!
  name: String!
}

type WorkspaceMembership {
  workspace: Workspace!
  role: WorkspaceRole!
  createdAt: DateTime!
}

enum WorkspaceRole {
  MEMBER
  ADMIN
  OWNER
}
